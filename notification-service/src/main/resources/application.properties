spring.application.name=notification-service
server.port=8082

spring.kafka.bootstrap-servers = localhost:9092
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-serializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.listener.ack-mode=manual

spring.kafka.properties.spring.json.trusted.packages=com.learning.kafka.common.dto
#spring.kafka.properties.spring.json.value.default.type=com.learning.kafka.notification_service.dto